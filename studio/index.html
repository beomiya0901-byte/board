<title>키워드 스튜디오</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 폰은 하단 탭 + 한 열, PC(960px~)는 왼쪽 사이드바 + 가운데 작업 열. 카드는 "작업 단위"에만 씀. */
:root{
 --bg:#f3f4f1; --surface:#ffffff; --sunk:#eceee9; --ink:#1b1f1d; --muted:#646e69; --line:#dfe3dd;
 --accent:#2a56c6; --accent-ink:#ffffff; --soft:#e6ecfa;
 --good:#1d7f47; --good-bg:#e1f2e7; --warn:#9a5c00; --warn-bg:#fbefd9; --bad:#b9342b; --bad-bg:#f9e3e0;
 --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
 --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
 --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#101312; --surface:#191d1b; --sunk:#222725; --ink:#ebeeea; --muted:#9aa39e; --line:#2b312e;
 --accent:#86a6ff; --accent-ink:#0c1222; --soft:#1d2643;
 --good:#62c98d; --good-bg:#16301f; --warn:#e3a54c; --warn-bg:#33270f; --bad:#f08077; --bad-bg:#3a1c19; color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#101312; --surface:#191d1b; --sunk:#222725; --ink:#ebeeea; --muted:#9aa39e; --line:#2b312e;
 --accent:#86a6ff; --accent-ink:#0c1222; --soft:#1d2643;
 --good:#62c98d; --good-bg:#16301f; --warn:#e3a54c; --warn-bg:#33270f; --bad:#f08077; --bad-bg:#3a1c19; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);margin:0}
main{max-width:760px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:960px){main{margin-left:240px;margin-right:auto;padding-block:36px 60px;padding-left:40px;padding-right:40px;max-width:900px}}
h1{font-size:26px;line-height:1.25;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:17px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0}
p{margin:0}
a{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:28px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.head{display:flex;flex-direction:column;gap:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.note{background:var(--soft);border-radius:var(--r-sm);padding:10px 12px;font-size:13px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--surface);border-top:1px solid var(--line);
 padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
.nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:11.5px;font-weight:600;padding:8px 0 6px;min-height:52px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:10px}
.nav button svg{width:20px;height:20px}
.nav button.on{color:var(--accent)}
.brand{display:none}
@media (min-width:960px){
 .nav{top:0;right:auto;width:240px;flex-direction:column;gap:2px;border-top:0;border-right:1px solid var(--line);padding:28px 14px;padding-left:max(14px,env(safe-area-inset-left,0px))}
 .nav button{flex:none;flex-direction:row;gap:10px;font-size:14px;min-height:42px;padding:0 12px;justify-content:flex-start}
 .nav button.on{background:var(--soft)}
 .brand{display:block;font-weight:700;font-size:16px;padding:0 12px 18px}
 .brand span{display:block;font-weight:400;font-size:12px;color:var(--muted)}
}
/* controls */
.btn{border:0;border-radius:var(--r-sm);padding:10px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;min-height:42px;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sub{background:var(--sunk);color:var(--ink)}
.btn.line{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.text{background:none;color:var(--accent);padding:6px 8px;min-height:34px}
.btn.danger{background:none;color:var(--bad);padding:6px 8px;min-height:34px}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn.block{width:100%}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);min-width:0}
.inp,textarea,select{width:100%;background:var(--sunk);color:var(--ink);border:1px solid transparent;border-radius:var(--r-sm);padding:10px 12px;font:inherit;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
textarea{min-height:90px;resize:vertical;line-height:1.5}
textarea.prompt{font-size:13px;min-height:150px;color:var(--muted)}
.inp:focus,textarea:focus,select:focus{border-color:var(--accent)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
button:focus-visible,a:focus-visible,.inp:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;min-height:34px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .tag{font-size:11px;font-weight:600;opacity:.75}
.seg{display:flex;background:var(--sunk);border-radius:var(--r-sm);padding:3px;gap:2px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:7px;cursor:pointer;font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;min-height:36px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.acc{background:var(--soft);color:var(--accent)}
.st-후보{background:var(--sunk);color:var(--muted)}
.st-분석됨{background:var(--soft);color:var(--accent)}
.st-채택{background:var(--good-bg);color:var(--good)}
.st-보류{background:var(--warn-bg);color:var(--warn)}
.st-제외{background:var(--bad-bg);color:var(--bad)}
/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.pipe button{border:0;border-right:1px solid var(--line);background:none;font:inherit;color:var(--ink);padding:12px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.pipe button:last-child{border-right:0}
.pipe b{font-family:var(--f-num);font-size:22px;font-weight:600;line-height:1.1}
.pipe span{font-size:12px;color:var(--muted)}
.pipe .arrow{color:var(--line)}
/* keyword rows */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kwrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.kwrow:last-child{border-bottom:0}
.kwrow:hover{background:var(--sunk)}
.kwrow .k{font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.kwrow .m{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.kwrow .v{text-align:right;font-family:var(--f-num);font-weight:600;font-size:15px}
.kwrow .v small{display:block;font-family:var(--f-body);font-weight:400;font-size:11.5px;color:var(--muted)}
.dots{display:inline-flex;gap:3px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.추천{background:var(--good)}.dot.보통{background:var(--warn)}.dot.비추천{background:var(--bad)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
/* metrics */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.metric{background:var(--sunk);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.metric span{font-size:12px;color:var(--muted)}
.metric input{background:none;border:0;padding:0;font-family:var(--f-num);font-size:18px;font-weight:600;color:var(--ink);width:100%;outline:none}
.metric input:focus{box-shadow:0 2px 0 var(--accent)}
.metric b{font-family:var(--f-num);font-size:18px;font-weight:600}
/* analysis */
.ana{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ana:first-of-type{border-top:0;padding-top:0}
.kv{display:grid;grid-template-columns:88px minmax(0,1fr);gap:4px 10px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
details pre{white-space:pre-wrap;font:12.5px/1.5 var(--f-body);background:var(--sunk);padding:10px;border-radius:var(--r-sm);margin:8px 0 0;overflow-wrap:anywhere}
.rel{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.rel:last-child{border-bottom:0}
.rel .k{font-weight:600;overflow-wrap:anywhere}
.rel .k small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.parsed{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.parsed label{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.parsed label:last-child{border-bottom:0}
.parsed input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent)}
.parsed small{display:block;color:var(--muted);font-size:12px}
.steps{display:flex;flex-direction:column;gap:14px;counter-reset:s}
.step{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px}
.step::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font:600 12px/24px var(--f-num);text-align:center}
.step>div{display:flex;flex-direction:column;gap:8px;min-width:0}
table.stat{width:100%;border-collapse:collapse;font-size:13.5px}
table.stat th,table.stat td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.stat th:first-child,table.stat td:first-child{text-align:left}
table.stat th{color:var(--muted);font-weight:600;font-size:12px}
.tw{overflow-x:auto}
.links{display:flex;gap:6px;flex-wrap:wrap}
.links a{font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:5px 11px;color:var(--ink)}
.links a:hover{border-color:var(--accent);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;font-size:14px;max-width:calc(100% - 32px);text-align:center;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:960px){.toast{bottom:28px;left:calc(50% + 120px)}}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
</style>

<nav class="nav" aria-label="메뉴">
 <div class="brand">키워드 스튜디오<span>네이버 블로그 키워드 리서치</span></div>

 <button data-a="tab" data-v="discover" id="nav-discover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/><path d="M11 8v6M8 11h6"/></svg>발굴</button>
 <button data-a="tab" data-v="list" id="nav-list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M4 12h16M4 17h7"/><circle cx="18" cy="7" r="2"/></svg>키워드</button>
 <button data-a="tab" data-v="agents" id="nav-agents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="9" r="3"/><circle cx="17" cy="9" r="3"/><path d="M3 19c.8-2.8 2.7-4 5-4s4.2 1.2 5 4M12.5 16c.9-.7 2.3-1 4.5-1 2.3 0 4.2 1.2 5 4"/></svg>에이전트</button>

</nav>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https:\/\//.test(String(u||''))?esc(u):'';
const clone=o=>JSON.parse(JSON.stringify(o));
const nowIso=()=>new Date().toISOString();
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt=n=>n==null||isNaN(n)?'—':Math.round(n).toLocaleString('ko-KR');
const when=iso=>{try{return new Date(iso).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}};

const STAGES=['후보','분석됨','채택','보류','제외'];
const STEPS={discover:'키워드 발굴',analyze:'키워드 분석',related:'연관 키워드'};
const DEFAULT_CFG={
 blogUrl:'https://blog.naver.com/beompercar',
 topics:'IT·테크 정보글',
 minVol:30000,
 goodPct:20,
 agents:[
  {id:'pickle',name:'피클',note:''},
  {id:'muse',name:'뮤즈',note:''},
  {id:'voo',name:'voo',note:''},
  {id:'keyring',name:'키링',note:''},
  {id:'claude',name:'클로드',note:'이 앱 안에서 바로 실행할 수 있어요'}
 ],
 assign:{discover:'',analyze:'',related:''}
};

/* ---------- state ---------- */
const ST={
 mode:'loading', ready:false, note:'',
 kws:[], cfg:clone(DEFAULT_CFG),
 view:'home', sel:null,
 filter:{stage:'',q:'',sort:'recent'},
 jobs:{
  discover:{agent:null,seed:'',notes:'',n:'15',paste:'',parsed:null},
  analyze:{agent:null,paste:'',open:false},
  related:{agent:null,paste:'',open:false}
 },
 manual:'', relManual:'', bt:{disc:'',detail:'',parsed:null}, armed:null, busy:{}, showData:false
};
let DB=null, SAMPLE=null, composing=false, pendingRender=false;

/* ---------- normalize untrusted rows ---------- */
const numOrNull=v=>{const n=Number(v);return v===''||v==null||!isFinite(n)?null:n};
function normKw(id,d){
 d=d||{};
 return {id:String(id),kw:String(d.kw||''),stage:STAGES.includes(d.stage)?d.stage:'후보',
  src:d.src&&typeof d.src==='object'?{agent:String(d.src.agent||''),step:String(d.src.step||'manual'),from:String(d.src.from||'')}:{agent:'',step:'manual',from:''},
  pc:numOrNull(d.pc),mo:numOrNull(d.mo),vol:numOrNull(d.vol),pub:numOrNull(d.pub),estVol:numOrNull(d.estVol),bt:normBt(d.bt),memo:String(d.memo||''),
  analyses:Array.isArray(d.analyses)?d.analyses.filter(a=>a&&typeof a==='object').map(a=>({id:String(a.id||newId('a')),agent:String(a.agent||''),at:String(a.at||''),verdict:['추천','보통','비추천'].includes(a.verdict)?a.verdict:'',score:numOrNull(a.score),pc:numOrNull(a.pc),mo:numOrNull(a.mo),pub:numOrNull(a.pub),comp:String(a.comp||''),intent:String(a.intent||''),title:String(a.title||''),why:String(a.why||''),raw:String(a.raw||''),est:!!a.est})):[],
  related:Array.isArray(d.related)?d.related.filter(r=>r&&typeof r==='object').map(r=>({id:String(r.id||newId('r')),kw:String(r.kw||''),vol:numOrNull(r.vol),pub:numOrNull(r.pub),memo:String(r.memo||''),agent:String(r.agent||''),at:String(r.at||''),promoted:String(r.promoted||'')})):[],
  createdAt:String(d.createdAt||''),updatedAt:String(d.updatedAt||'')};
}
function normBt(b){
 if(!b||typeof b!=='object')return null;
 const o={};['grade','entry','speed','ad','season','peakNow','yoy','trend','brief','category','at'].forEach(k=>{if(b[k]!=null&&b[k]!=='')o[k]=String(b[k]).slice(0,80)});
 ['cum','slots'].forEach(k=>{const n=numOrNull(b[k]);if(n!=null)o[k]=n});
 if(b.top5&&typeof b.top5==='object'){const t={};['titleLen','chars','kwCount','images','visitors'].forEach(k=>{const n=numOrNull(b.top5[k]);if(n!=null)t[k]=n});['level','age'].forEach(k=>{if(b.top5[k])t[k]=String(b.top5[k]).slice(0,30)});o.top5=t}
 return Object.keys(o).length?o:null;
}
function normCfg(d){
 d=d||{};const c=clone(DEFAULT_CFG);
 if(typeof d.blogUrl==='string')c.blogUrl=d.blogUrl;
 if(typeof d.topics==='string')c.topics=d.topics;
 if(numOrNull(d.minVol)!=null)c.minVol=Number(d.minVol);
 if(numOrNull(d.goodPct)!=null)c.goodPct=Number(d.goodPct);
 if(Array.isArray(d.agents)&&d.agents.length)c.agents=d.agents.filter(a=>a&&a.id).map(a=>({id:String(a.id),name:String(a.name||a.id),note:String(a.note||'')}));
 if(d.assign&&typeof d.assign==='object')Object.keys(c.assign).forEach(k=>{c.assign[k]=String(d.assign[k]||'')});
 return c;
}

/* ---------- persistence ---------- */
const LKEY='kw-studio-v1';
function lsGet(){try{return JSON.parse(localStorage.getItem(LKEY)||'null')}catch(e){return null}}
function lsSet(){try{localStorage.setItem(LKEY,JSON.stringify({kws:ST.kws,cfg:ST.cfg}))}catch(e){}}
const Q={};
function enqueue(key,fn){const p=(Q[key]||Promise.resolve()).then(fn).catch(e=>{toast(dbErr(e))});Q[key]=p;return p}
function dbErr(e){const c=e&&e.code;if(c==='quota_exceeded')return '저장 공간이 꽉 찼어요. 제외한 키워드를 지워 주세요.';if(c==='revoked')return '저장 권한이 사라졌어요. 새로고침해 주세요.';return '저장하지 못했어요. 잠시 뒤 다시 해 주세요.'}
function saveKw(k){
 k.updatedAt=nowIso();if(!k.createdAt)k.createdAt=k.updatedAt;
 const i=ST.kws.findIndex(x=>x.id===k.id);if(i<0)ST.kws.unshift(k);else ST.kws[i]=k;
 if(DB){const body=clone(k);delete body.id;enqueue('kw:'+k.id,()=>DB.collection('keywords').doc(k.id).set(body))}else lsSet();
}
function removeKw(id){
 ST.kws=ST.kws.filter(x=>x.id!==id);
 ST.kws.forEach(k=>{let ch=false;k.related.forEach(r=>{if(r.promoted===id){r.promoted='';ch=true}});if(ch)saveKw(k)});
 if(DB)enqueue('kw:'+id,()=>DB.collection('keywords').doc(id).delete());else lsSet();
}
function saveCfg(){if(DB){const b=clone(ST.cfg);enqueue('cfg',()=>DB.doc('config/main').set(b))}else lsSet()}
const getKw=id=>ST.kws.find(k=>k.id===id)||null;
const editKw=id=>{const k=getKw(id);return k?clone(k):null};

/* ---------- metrics ---------- */
function total(k){return k.pc==null&&k.mo==null?(k.vol??null):(k.pc||0)+(k.mo||0)}
function ratio(k){const t=total(k);return k.pub==null||!t?null:k.pub/t*100}
const pctFmt=r=>r==null?'—':(r>=100?'100%↑':(r<10?r.toFixed(1):Math.round(r))+'%');
function ratioCls(r){if(r==null)return '';const g=ST.cfg.goodPct;return r<=g?'good':r<=g*3?'warn':'bad'}
function volCls(t){return t==null?'':t>=ST.cfg.minVol?'good':'bad'}
function ratioPill(k){const r=ratio(k);return r==null?'':'<span class="pill '+ratioCls(r)+'">포화도 '+pctFmt(r)+'</span>'}
function verdictCount(k){const c={추천:0,보통:0,비추천:0};k.analyses.forEach(a=>{if(c[a.verdict]!=null)c[a.verdict]++});return c}
const agentName=id=>{if(id==='blogtalk')return '블로그톡';const a=ST.cfg.agents.find(x=>x.id===id);return a?a.name:(id||'직접')};
const stagePill=s=>'<span class="pill st-'+esc(s)+'">'+esc(s)+'</span>';

/* ---------- parsing pasted agent output ---------- */
function parseNum(s){
 if(s==null)return null;s=String(s).replace(/,/g,'');
 const m=s.match(/(\d+(?:\.\d+)?)\s*(만|천|k|K)?/);if(!m)return null;
 let n=parseFloat(m[1]);if(m[2]==='만')n*=1e4;else if(m[2]==='천'||m[2]==='k'||m[2]==='K')n*=1e3;
 return Math.round(n);
}
function parseList(text){
 const out=[],seen={};
 String(text||'').split(/\r?\n/).forEach(line=>{
  let l=line.trim();if(!l)return;
  if(/^[|\s:-]+$/.test(l))return;
  l=l.replace(/^\|/,'').replace(/\|$/,'').trim();
  l=l.replace(/^(?:[-*•·]|\d+[.)])\s*/,'').replace(/\*\*/g,'').trim();
  let parts=l.split(/\s*[|\t]\s*/);
  if(parts.length<2){const m=l.match(/^(.+?)\s*[-–:]\s*(.+)$/);parts=m?[m[1],m[2]]:[l]}
  const kw=parts[0].replace(/^["'“”]+|["'“”]+$/g,'').trim();
  if(!kw||kw.length>40||/^(키워드|연관 ?키워드|keyword)$/i.test(kw))return;
  const key=kw.replace(/\s/g,'');if(seen[key])return;seen[key]=1;
  let vol=null,memo='';
  if(parts.length>1){const v=parseNum(parts[1]);if(v!=null&&/\d/.test(parts[1])&&parts[1].length<20){vol=v;memo=parts.slice(2).join(' · ')}else memo=parts.slice(1).join(' · ')}
  out.push({kw,vol,memo:memo.trim()});
 });
 return out;
}
function field(text,labels){
 for(const lb of labels){const re=new RegExp('^\\s*[-*]*\\s*\\**\\s*(?:'+lb+')\\s*\\**\\s*[:：]\\s*(.+)$','im');const m=String(text).match(re);if(m)return m[1].replace(/\*\*/g,'').trim()}
 return '';
}
function normVerdict(v){v=String(v||'');if(/비추/.test(v))return '비추천';if(/추천/.test(v))return '추천';if(/보통|중간/.test(v))return '보통';return ''}
function parseAnalysis(text){
 const a={verdict:normVerdict(field(text,['판정','결론','추천 ?여부'])),
  score:parseNum(field(text,['점수','score'])),
  pc:parseNum(field(text,['월\\s*검색량\\s*\\(?PC\\)?','PC\\s*검색량','PC'])),
  mo:parseNum(field(text,['월\\s*검색량\\s*\\(?모바일\\)?','모바일\\s*검색량','모바일','MO'])),
  pub:parseNum(field(text,['월\\s*발행량(?:\\s*\\([^)]*\\))?','발행량'])),
  comp:field(text,['경쟁(?:도|강도)?']),
  intent:field(text,['검색\\s*의도','의도']),
  title:field(text,['노릴 만한 제목(?: 예시)?','제목(?: 예시)?']),
  why:field(text,['근거','이유','메모','코멘트'])};
 a.est=/추정/.test(text);
 return a;
}

/* ---------- 블로그톡 붙여넣기 ---------- */
const AD=/^(높음|중간|낮음)$/, isNumTok=x=>/^[\d,]+$/.test(x), isPctTok=x=>/^[\d.]+%\s*↑?$/.test(x);
function btRows(text){
 const out=[],seen={};
 const push=(kw,vol,pub,sat,ad)=>{kw=String(kw).replace(/^[☐□✓✔☑\s]+/,'').trim();
  if(!kw||kw.length>40||/[:：]/.test(kw)||/^(키워드|월|검색량|발행량|콘텐츠|포화도|광고|경쟁)$/.test(kw))return;
  const d=dupKey(kw);if(seen[d])return;seen[d]=1;out.push({kw,vol:parseNum(vol),pub:parseNum(pub),sat:String(sat).replace(/\s/g,''),ad})};
 String(text).split(/\r?\n/).forEach(l=>{const m=l.trim().match(/^(.+?)\s+([\d,]+)\s+([\d,]+)\s+([\d.]+%\s*↑?)\s+(높음|중간|낮음)\b/);if(m)push(m[1],m[2],m[3],m[4],m[5])});
 const t=[];String(text).split(/[\r\n\t]+/).map(x=>x.trim()).filter(Boolean).forEach(x=>{if(/^↑$/.test(x)&&t.length)t[t.length-1]+='↑';else t.push(x)});
 for(let i=0;i+4<t.length;i++){if(!isNumTok(t[i])&&!isPctTok(t[i])&&!AD.test(t[i])&&isNumTok(t[i+1])&&isNumTok(t[i+2])&&isPctTok(t[i+3])&&AD.test(t[i+4])){push(t[i],t[i+1],t[i+2],t[i+3],t[i+4]);i+=4}}
 return out;
}
function btMain(text){
 const s=String(text||'').replace(/[?ⓘ]/g,' ').replace(/\s+/g,' ');
 const g=re=>{const m=s.match(re);return m?m[1].trim():''};
 const r={};
 r.kw=g(/['‘’"“”]([^'‘’"“”]{1,40})['‘’"“”]\s*분석 결과/);
 r.vol=parseNum(g(/월간? 검색량\s*([\d,]+)/));
 r.mo=parseNum(g(/모바일\s*([\d,]+)\s*\(/));r.pc=parseNum(g(/PC\s*([\d,]+)\s*\(/));
 r.pub=parseNum(g(/월간? (?:콘텐츠 )?발행량\s*([\d,]+)/));
 r.cum=parseNum(g(/누적\s*([\d,]+)/));
 r.slots=parseNum(g(/블로그 자리\s*(\d+)\s*칸/));
 r.grade=g(/키워드 등급\s*([A-F][+-]?)(?![A-Za-z가-힣])/);
 r.entry=g(/진입 가능성\s*(높음|보통|중간|낮음)/);
 r.speed=g(/진입 속도\s*(빠름|보통|느림)/);
 r.ad=g(/광고 경쟁\s*(높음|중간|낮음)/);
 r.season=g(/성수기 구간\s*(.{1,20}?)\s*성수기 대비/);
 r.peakNow=g(/성수기 대비 지금\s*(\d+%)/);
 r.yoy=g(/전년 동월 대비\s*([+\-−]?\s*\d+(?:\.\d+)?%)/);
 r.trend=g(/24개월 추세\s*((?:▲|▼)?\s*(?:증가|감소|유지)?\s*\d+(?:\.\d+)?%)/);
 r.brief=g(/블토기 브리핑\s*(.{2,30}?)\s*(?:키워드 분석|💡|이런 점)/);
 r.category=g(/분석 결과\s*(?:저장\s*)?([가-힣A-Za-z]+[·ㆍ][가-힣A-Za-z]+)/);
 const re=/블로그 레벨\s*(Lv\s?\d+|없음)\s*유효키워드 수\s*([\d,]+)개\s*전체 순위\s*(\S+)\s*발행일\s*(.{1,12}?)\s*제목 길이\s*(\d+)자\s*글자 수\s*([\d,]+)자\s*키워드 수\s*(\d+)개\s*이미지 수\s*(\d+)장\s*방문자 수\s*([\d,]+)명/g;
 let m,best=null;while((m=re.exec(s))){if(parseNum(m[6])>0)best=m}

function agentStats(){
 return ST.cfg.agents.map(a=>{
  const d=ST.kws.filter(k=>k.src.step==='discover'&&k.src.agent===a.id);
  const dA=d.filter(k=>k.stage==='채택').length;
  let an=0,rec=0,dec=0,agree=0,rel=0,relP=0;
  ST.kws.forEach(k=>{
   k.analyses.forEach(x=>{if(x.agent!==a.id)return;an++;if(x.verdict==='추천')rec++;
    if((k.stage==='채택'||k.stage==='제외')&&x.verdict){dec++;if((x.verdict==='추천'&&k.stage==='채택')||(x.verdict==='비추천'&&k.stage==='제외'))agree++}});
   k.related.forEach(x=>{if(x.agent!==a.id)return;rel++;if(x.promoted)relP++});
  });
  return {a,d:d.length,dA,an,rec,dec,agree,rel,relP};
 });
}

function render(){

 const main=$('main'),a=document.activeElement;
 const fid=a&&main.contains(a)?a.id:'';let s1=null,s2=null,keepVal=null;
 if(fid){try{s1=a.selectionStart;s2=a.selectionEnd}catch(e){}if(a.dataset&&(a.dataset.kwf||a.dataset.cfg||a.dataset.agentf))keepVal=a.value}
 main.innerHTML=(VIEWS[ST.view]||homeV)();
 const navV=ST.view==='detail'?'list':ST.view;
 document.querySelectorAll('.nav button').forEach(b=>{const on=b.dataset.v===navV;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 if(fid){const e=$(fid);if(e){if(keepVal!=null)e.value=keepVal;try{e.focus({preventScroll:true});if(s1!=null)e.setSelectionRange(s1,s2)}catch(x){}}}

function go(view){ST.view=view;ST.armed=null;window.scrollTo(0,0);render()}
function openKw(id){
 if(ST.sel!==id){ST.jobs.analyze={agent:ST.cfg.assign.analyze||null,paste:'',open:false};ST.jobs.related={agent:ST.cfg.assign.related||null,paste:'',open:false};ST.relManual='';ST.bt.detail=''}
 ST.sel=id;go('detail');

/* ---------- actions ---------- */
function dupKey(s){return String(s).replace(/\s/g,'').toLowerCase()}
function findByKw(s){const d=dupKey(s);return ST.kws.find(k=>dupKey(k.kw)===d)}
function makeKw(kw,src,vol,memo){
 const k=normKw(newId('k'),{kw:kw,stage:'후보',src:src,memo:memo||''});
 if(vol!=null)k.estVol=vol;
 return k;
}
function addAnalysis(k,a,agent,raw){
 const x=Object.assign({id:newId('a'),agent:agent,at:nowIso(),raw:raw||''},a);
 k.analyses.push(normKw('t',{analyses:[x]}).analyses[0]);
 if(k.pc==null&&k.mo==null&&k.vol==null){if(x.pc!=null)k.pc=x.pc;if(x.mo!=null)k.mo=x.mo}
 if(k.pub==null&&x.pub!=null)k.pub=x.pub;
 if(k.stage==='후보')k.stage='분석됨';
}
function addRelated(k,items,agent){
 let n=0;const have={};k.related.forEach(r=>have[dupKey(r.kw)]=1);have[dupKey(k.kw)]=1;
 items.forEach(it=>{const d=dupKey(it.kw);if(!it.kw||have[d])return;have[d]=1;const ex=findByKw(it.kw);
  k.related.push({id:newId('r'),kw:it.kw,vol:it.vol??null,pub:it.pub??null,memo:it.memo||'',agent:agent,at:nowIso(),promoted:ex?ex.id:''});n++});
 return n;
}
function markDups(list){return list.map(p=>Object.assign(p,{dup:!!findByKw(p.kw),on:!findByKw(p.kw)}))}

function readPaste(step){
 const j=ST.jobs[step],txt=j.paste.trim();
 if(!txt)return toast('받은 답을 먼저 붙여 넣어 주세요');
 if(step==='discover'){j.parsed=markDups(parseList(txt));render();return}
 const k=editKw(ST.sel);if(!k)return;
 if(step==='analyze'){
  const a=parseAnalysis(txt);
  addAnalysis(k,a,j.agent,txt);saveKw(k);j.paste='';j.open=false;
  toast(a.verdict?agentName(j.agent)+' 분석을 저장했어요':'판정을 못 읽었지만 원문은 저장했어요');
 }else{
  const items=parseList(txt);const n=addRelated(k,items,j.agent);saveKw(k);
  if(n){j.paste='';j.open=false;toast('연관 키워드 '+n+'개를 넣었어요')}else toast('새로 넣을 연관 키워드가 없었어요');
 }
 render();
}
const CTL={};
function sampleErr(e){
 const c=e&&e.code;
 if(c==='cancelled')return '';
 if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed'){SAMPLE=null;return '이 화면에서는 클로드를 바로 쓸 수 없어요. 요청문을 복사해서 써 주세요.'}
 if(c==='rate_limited')return '클로드 사용량이 잠시 꽉 찼어요. 조금 뒤에 다시 눌러 주세요.';
 if(c==='invalid_json')return '클로드 답을 읽지 못했어요. 한 번 더 눌러 주세요.';
 if(c==='session_expired')return 'claude.ai에 다시 로그인해 주세요.';
 return '클로드 응답이 끊겼어요. 다시 눌러 주세요.';
}
async function runClaude(step){
 if(!SAMPLE||ST.busy[step])return;
 const k=step==='discover'?null:getKw(ST.sel);if(step!=='discover'&&!k)return;
 const ctl=new AbortController();CTL[step]=ctl;ST.busy[step]=true;render();
 try{
  const res=await SAMPLE.json(promptFor(step,k,true),{signal:ctl.signal,modelTier:'default'});
  if(step==='discover'){
   const arr=Array.isArray(res)?res:[];
   ST.jobs.discover.parsed=markDups(arr.filter(x=>x&&x.kw).map(x=>({kw:String(x.kw).slice(0,40),vol:numOrNull(x.vol),memo:String(x.why||'')})));
  }else if(step==='analyze'){
   const kk=editKw(k.id);if(!kk)throw {code:'gone'};
   const r=res&&typeof res==='object'?res:{};
   addAnalysis(kk,{verdict:normVerdict(r.verdict),score:numOrNull(r.score),pc:numOrNull(r.pc),mo:numOrNull(r.mo),pub:numOrNull(r.pub),comp:String(r.comp||''),intent:String(r.intent||''),title:String(r.title||''),why:String(r.why||''),est:true},'claude','');
   saveKw(kk);ST.jobs.analyze.open=false;toast('클로드 분석을 저장했어요');
  }else{
   const kk=editKw(k.id);if(!kk)throw {code:'gone'};
   const arr=Array.isArray(res)?res:[];
   const n=addRelated(kk,arr.filter(x=>x&&x.kw).map(x=>({kw:String(x.kw).slice(0,40),vol:numOrNull(x.vol),memo:String(x.memo||'')})),'claude');
   saveKw(kk);ST.jobs.related.open=false;toast('연관 키워드 '+n+'개를 넣었어요');
  }
 }catch(e){const m=sampleErr(e);if(m)toast(m)}
 finally{ST.busy[step]=false;CTL[step]=null;render()}
}

document.addEventListener('click',e=>{

  case 'addPicked':{const j=ST.jobs.discover;const pick=(j.parsed||[]).filter(p=>p.on&&!findByKw(p.kw));
   pick.slice().reverse().forEach(p=>saveKw(makeKw(p.kw,{agent:j.agent||'',step:'discover',from:''},p.vol,p.memo)));
   j.parsed=null;j.paste='';toast(pick.length+'개를 후보로 넣었어요');break}
  case 'addManual':{const items=parseList(ST.manual);let n=0;items.slice().reverse().forEach(p=>{if(findByKw(p.kw))return;const k=makeKw(p.kw,{agent:'',step:'manual',from:''},null,p.memo);if(p.vol!=null)k.mo=p.vol;saveKw(k);n++});
   if(!items.length)return toast('키워드를 한 줄에 하나씩 적어 주세요');ST.manual='';toast(n?n+'개를 후보로 넣었어요':'모두 이미 있는 키워드예요');break}
  case 'setStage':{const k=editKw(ST.sel);if(!k||k.stage===el.dataset.v)return;k.stage=el.dataset.v;saveKw(k);break}
  case 'applyNums':{const k=editKw(ST.sel);if(!k)return;const x=k.analyses.find(y=>y.id===id);if(!x)return;if(x.pc!=null)k.pc=x.pc;if(x.mo!=null)k.mo=x.mo;if(x.pub!=null)k.pub=x.pub;saveKw(k);toast(agentName(x.agent)+'의 숫자로 바꿨어요');break}
  case 'delAna':{if(wasArmed!=='ana:'+id){ST.armed='ana:'+id;break}ST.armed=null;const k=editKw(ST.sel);if(!k)return;k.analyses=k.analyses.filter(y=>y.id!==id);if(!k.analyses.length&&k.stage==='분석됨')k.stage='후보';saveKw(k);toast('분석을 지웠어요');break}
  case 'delKw':{if(wasArmed!=='kw:'+ST.sel){ST.armed='kw:'+ST.sel;break}ST.armed=null;removeKw(ST.sel);toast('키워드를 지웠어요');go('list');return}
  case 'promote':{const k=editKw(ST.sel);if(!k)return;const r=k.related.find(y=>y.id===id);if(!r)return;const ex=findByKw(r.kw);
   if(ex){r.promoted=ex.id}else{const real=r.agent==='blogtalk';const nk=makeKw(r.kw,{agent:r.agent,step:'related',from:k.id},real?null:r.vol,r.memo);if(real){nk.vol=r.vol;nk.pub=r.pub}saveKw(nk);r.promoted=nk.id}
   saveKw(k);toast('후보에 넣었어요: '+r.kw);break}
  case 'delRel':{const k=editKw(ST.sel);if(!k)return;k.related=k.related.filter(y=>y.id!==id);saveKw(k);break}
  case 'addRelManual':{const k=editKw(ST.sel);if(!k)return;const items=parseList(ST.relManual);if(!items.length)return toast('연관 키워드를 적어 주세요');const n=addRelated(k,items,'');saveKw(k);ST.relManual='';toast(n?'추가했어요':'이미 있는 키워드예요');break}
  case 'addAgent':{const ag={id:newId('g'),name:'새 에이전트',note:''};ST.cfg.agents.push(ag);saveCfg();break}
  case 'delAgent':{if(wasArmed!=='agent:'+id){ST.armed='agent:'+id;break}ST.armed=null;ST.cfg.agents=ST.cfg.agents.filter(x=>x.id!==id);Object.keys(ST.cfg.assign).forEach(s=>{if(ST.cfg.assign[s]===id)ST.cfg.assign[s]=''});Object.keys(ST.jobs).forEach(s=>{if(ST.jobs[s].agent===id)ST.jobs[s].agent=null});saveCfg();break}
  case 'btRead':{const txt=ST.bt.disc.trim();if(!txt)return toast('블로그톡 화면을 복사해서 붙여 넣어 주세요');const p=btParse(txt);
   const items=[];if(p.main.kw&&p.hasMain)items.push({kw:p.main.kw,vol:p.main.vol,pub:p.main.pub,ad:p.main.ad,main:true});
   p.rows.forEach(x=>{if(!items.some(y=>dupKey(y.kw)===dupKey(x.kw)))items.push(x)});
   items.forEach(x=>{const ex=findByKw(x.kw);x.dup=!!ex;x.on=x.main?true:(!ex&&x.vol!=null&&x.vol>=ST.cfg.minVol)});
   ST.bt.parsed={main:p.hasMain?p.main:null,items};if(!items.length)toast('읽을 수 있는 키워드가 없었어요');break}
  case 'btPick':{const it=ST.bt.parsed&&ST.bt.parsed.items[+el.dataset.i];if(it&&!(it.dup&&!it.main))it.on=el.checked;const on=ST.bt.parsed.items.filter(x=>x.on).length;const b=document.querySelector('[data-a="btAdd"]');if(b){b.disabled=!on;b.textContent='선택한 '+on+'개 넣기'}return}
  case 'btClear':ST.bt.parsed=null;break;
  case 'btAdd':{const P=ST.bt.parsed;if(!P)return;let mainK=null,n=0,up=0;
   const mainIt=P.items.find(x=>x.main);
   if(mainIt&&P.main){const ex=findByKw(mainIt.kw);mainK=ex?clone(ex):makeKw(mainIt.kw,{agent:'blogtalk',step:'discover',from:''},null,'');if(mainIt.on||ex){btApply(mainK,P.main);if(ex)up++;else n++}else mainK=null}
   const rows=P.items.filter(x=>!x.main);
   if(mainK){addRelated(mainK,rows.map(x=>({kw:x.kw,vol:x.vol,pub:x.pub,memo:btMemo(x)})),'blogtalk')}
   rows.filter(x=>x.on&&!findByKw(x.kw)).slice().reverse().forEach(x=>{const nk=makeKw(x.kw,mainK?{agent:'blogtalk',step:'related',from:mainK.id}:{agent:'blogtalk',step:'discover',from:''},null,'');nk.vol=x.vol;nk.pub=x.pub;if(x.ad)nk.bt={ad:x.ad,at:nowIso()};saveKw(nk);n++;
    if(mainK){const r=mainK.related.find(y=>dupKey(y.kw)===dupKey(x.kw));if(r)r.promoted=nk.id}});
   if(mainK)saveKw(mainK);
   ST.bt.parsed=null;ST.bt.disc='';toast((n?n+'개를 후보로 넣었어요':'')+(up?(n?' · ':'')+'기존 키워드 데이터를 갱신했어요':'')||'넣을 키워드가 없었어요');break}
  case 'btDetail':{const k=editKw(ST.sel);if(!k)return;const txt=ST.bt.detail.trim();if(!txt)return toast('블로그톡 화면을 복사해서 붙여 넣어 주세요');const p=btParse(txt);
   if(p.hasMain&&p.main.kw&&dupKey(p.main.kw)!==dupKey(k.kw))return toast('「'+p.main.kw+'」의 결과예요. 이 키워드를 검색한 화면을 붙여 넣어 주세요');
   if(!p.hasMain&&!p.rows.length)return toast('블로그톡 숫자를 찾지 못했어요. 분석 결과 화면 전체를 복사해 주세요');
   if(p.hasMain)btApply(k,p.main);
   const n=addRelated(k,p.rows.filter(x=>dupKey(x.kw)!==dupKey(k.kw)).map(x=>({kw:x.kw,vol:x.vol,pub:x.pub,memo:btMemo(x)})),'blogtalk');
   saveKw(k);ST.bt.detail='';toast((p.hasMain?'블로그톡 숫자를 반영했어요':'')+(n?(p.hasMain?' · ':'')+'연관 키워드 '+n+'개 추가':''));break}
  case 'toggleData':ST.showData=!ST.showData;break;
  case 'copyDump':copyFrom('dump','데이터를 복사했어요');return;
 }
 render();
});
function setPath(path,val){const p=path.split('.');let o=ST;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val}
document.addEventListener('compositionstart',()=>{composing=true});
document.addEventListener('compositionend',e=>{composing=false;setTimeout(()=>{onBind(e.target);if(pendingRender){pendingRender=false;render()}},0)});
function onBind(el){
 if(!el||!el.dataset||!el.dataset.bind)return;
 setPath(el.dataset.bind,el.value);
 if(el.dataset.list){const l=$('kwlist');if(l)l.innerHTML=listBody()}
 if(/^jobs\.discover\.(seed|notes|n)$/.test(el.dataset.bind)){const p=$('prompt-discover');if(p)p.value=promptDiscover(false)}
}
document.addEventListener('input',e=>{if(e.isComposing||composing){if(e.target.dataset&&e.target.dataset.bind)setPath(e.target.dataset.bind,e.target.value);return}onBind(e.target)});
document.addEventListener('change',e=>{
 const el=e.target;if(!el.dataset)return;
 if(el.dataset.bind){onBind(el);return}
 if(el.dataset.kwf){const k=editKw(ST.sel);if(!k)return;const f=el.dataset.kwf;
  if(f==='memo'){if(k.memo===el.value)return;k.memo=el.value}else{const v=el.value.trim()===''?null:parseNum(el.value);if(k[f]===v)return;k[f]=v}
  saveKw(k);toast('저장했어요');render();return}
 if(el.dataset.cfg){const f=el.dataset.cfg;let v=el.value;if(f==='minVol'){v=parseNum(v);if(v==null)return toast('숫자로 적어 주세요')}if(f==='goodPct'){v=parseFloat(v);if(!isFinite(v)||v<=0)return toast('0보다 큰 숫자로 적어 주세요')}
  ST.cfg[f]=v;saveCfg();toast('저장했어요');render();return}
 if(el.dataset.agentf){const ag=ST.cfg.agents.find(x=>x.id===el.dataset.id);if(!ag)return;const v=el.value.trim();if(el.dataset.agentf==='name'&&!v){el.value=ag.name;return}ag[el.dataset.agentf]=v;saveCfg();toast('저장했어요');render();return}
 if(el.dataset.assign){ST.cfg.assign[el.dataset.assign]=el.value;if(!ST.jobs[el.dataset.assign].agent)ST.jobs[el.dataset.assign].agent=el.value||null;saveCfg();toast(el.value?STEPS[el.dataset.assign]+'은 '+agentName(el.value)+'에게 맡겨요':'미정으로 바꿨어요');render();return}
});

/* ---------- boot ---------- */
function startLocal(){
 ST.mode='local';ST.ready=true;const d=lsGet();
 if(d){ST.kws=Array.isArray(d.kws)?d.kws.map(k=>normKw(k.id||newId('k'),k)):[];ST.cfg=normCfg(d.cfg)}
 ST.jobs.discover.agent=ST.cfg.assign.discover||null;render();
}
async function boot(){
 render();
 const c=window.claude;
 if(!c||typeof c.use!=='function'){startLocal();return}
 c.use('sample').then(s=>{SAMPLE=s||null;render()}).catch(()=>{});
 let db=null;try{db=await c.use('db')}catch(e){db=null}
 if(!db){startLocal();return}
 DB=db;ST.mode='db';render();
 const timer=setTimeout(()=>{if(!ST.ready){ST.note='저장소에 아직 연결되지 않았어요. 인터넷 연결을 확인해 주세요.';render()}},10000);
 let cfgSeen=false;
 db.collection('keywords').onSnapshot(s=>{
  ST.kws=s.docs.filter(d=>d.exists).map(d=>normKw(d.id,d.data()));
  if(!s.metadata.fromCache){clearTimeout(timer);ST.note=''}
  ST.ready=true;render();
 },()=>{clearTimeout(timer);ST.note='저장소 연결이 끊겼어요. 새로고침해 주세요.';render()});
 db.doc('config/main').onSnapshot(s=>{
  ST.cfg=s.exists?normCfg(s.data()):clone(DEFAULT_CFG);
  if(!cfgSeen){cfgSeen=true;if(!ST.jobs.discover.agent)ST.jobs.discover.agent=ST.cfg.assign.discover||null}
  render();
 },()=>{});
}
boot();
})();
</script>
